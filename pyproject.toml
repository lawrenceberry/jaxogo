[project]
name = "jaxogo"
version = "0.1.0"
description = "Voxel SVG logos in the style of the JAX logo"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Lawrence Berry", email = "lawrenceberry@outlook.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "matplotlib>=3.6",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/lawrenceberry/jaxogo"
Repository = "https://github.com/lawrenceberry/jaxogo"
Issues = "https://github.com/lawrenceberry/jaxogo/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.ruff.lint]
# On top of the default `select`, enable imports sorting
extend-select = ["I"]

[tool.coverage.run]
source = ["jaxogo"]
branch = true
